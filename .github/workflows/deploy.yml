name: Deploy to services-grc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, services-grc]
    steps:
      - name: Pull latest config and images, redeploy
        run: |
          cd /home/optecgrc/ciso-assistant-community
          git fetch origin main
          git reset --hard origin/main
          docker compose pull
          docker compose up -d
