name: Deploy to services-grc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, services-grc]
    steps:
      - name: Pull latest code, build and redeploy
        run: |
          cd /home/optecgrc/ciso-assistant-community
          git fetch origin main
          git reset --hard origin/main
          docker compose build backend frontend
          docker compose up -d
          docker compose exec -T backend python manage.py migrate --noinput
